<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the Carbu.com integration for Gladys Assistant (illustration, not
       the logo of Carbu.com). A fuel station at dusk, its price board showing
       the prices of the day. Built into cover.jpg by scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10213d"/>
      <stop offset="0.65" stop-color="#2c4a78"/>
      <stop offset="1" stop-color="#e09a5c"/>
    </linearGradient>
    <linearGradient id="canopy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6fa"/>
      <stop offset="1" stop-color="#cfd6e2"/>
    </linearGradient>
    <linearGradient id="pump" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f9d55"/>
      <stop offset="1" stop-color="#157a41"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a24"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="534" fill="url(#sky)"/>

  <!-- hills and a few roofs on the horizon -->
  <path d="M0 330 C 140 290, 260 300, 380 318 C 500 336, 620 300, 800 312 L800 534 L0 534 Z" fill="#1c2f4c"/>
  <path d="M0 350 L60 350 L60 326 L92 310 L124 326 L124 350 L180 350 L180 318 L222 318 L222 350 L800 350 L800 534 L0 534 Z" fill="#17263e"/>

  <!-- the ground and the forecourt -->
  <rect x="0" y="420" width="800" height="114" fill="#2a2f39"/>
  <rect x="0" y="420" width="800" height="6" fill="#9aa3b2"/>
  <rect x="0" y="478" width="800" height="4" fill="#3d4452"/>

  <!-- the canopy, its light on the forecourt -->
  <path d="M40 420 L420 420 L380 270 L80 270 Z" fill="url(#glow)"/>
  <rect x="40" y="246" width="380" height="30" rx="4" fill="url(#canopy)"/>
  <rect x="40" y="270" width="380" height="6" fill="#1f9d55"/>
  <rect x="96" y="276" width="12" height="144" fill="#c4ccd8"/>
  <rect x="352" y="276" width="12" height="144" fill="#c4ccd8"/>

  <!-- two pumps -->
  <g>
    <rect x="160" y="326" width="56" height="94" rx="6" fill="url(#pump)"/>
    <rect x="168" y="336" width="40" height="22" rx="3" fill="#0b0f16"/>
    <text x="188" y="352" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#7ee2a8" text-anchor="middle">2,266</text>
    <rect x="172" y="368" width="32" height="8" rx="2" fill="#e8f5ee"/>
    <path d="M216 350 q 22 6 18 40" stroke="#0b0f16" stroke-width="5" fill="none" stroke-linecap="round"/>
    <rect x="252" y="326" width="56" height="94" rx="6" fill="url(#pump)"/>
    <rect x="260" y="336" width="40" height="22" rx="3" fill="#0b0f16"/>
    <text x="280" y="352" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="700" fill="#7ee2a8" text-anchor="middle">2,064</text>
    <rect x="264" y="368" width="32" height="8" rx="2" fill="#e8f5ee"/>
    <path d="M308 350 q 22 6 18 40" stroke="#0b0f16" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- the price board -->
  <rect x="566" y="250" width="12" height="176" fill="#4a5262"/>
  <g>
    <rect x="470" y="40" width="300" height="214" rx="14" fill="url(#board)" stroke="#4a5262" stroke-width="3"/>
    <text x="494" y="78" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Liège · 4000</text>
    <g font-family="DejaVu Sans, sans-serif" font-size="17">
      <rect x="490" y="98" width="62" height="28" rx="5" fill="#2f6fb5"/>
      <text x="521" y="118" font-weight="700" fill="#ffffff" text-anchor="middle">B7</text>
      <text x="566" y="118" fill="#d7dde6">Diesel</text>
      <text x="750" y="118" font-weight="700" fill="#7ee2a8" text-anchor="end">2,266 €</text>
      <rect x="490" y="140" width="62" height="28" rx="5" fill="#1f9d55"/>
      <text x="521" y="160" font-weight="700" fill="#ffffff" text-anchor="middle">E10</text>
      <text x="566" y="160" fill="#d7dde6">Super 95</text>
      <text x="750" y="160" font-weight="700" fill="#7ee2a8" text-anchor="end">2,064 €</text>
      <rect x="490" y="182" width="62" height="28" rx="5" fill="#b8860b"/>
      <text x="521" y="202" font-weight="700" fill="#ffffff" text-anchor="middle">LPG</text>
      <text x="566" y="202" fill="#d7dde6">Autogas</text>
      <text x="750" y="202" font-weight="700" fill="#7ee2a8" text-anchor="end">1,029 €</text>
    </g>
    <text x="494" y="238" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#8fa0b8">max. 2,444 € → 2,401 € (19/10)</text>
  </g>

  <!-- title -->
  <text x="38" y="96" font-family="DejaVu Sans, sans-serif" font-size="62" font-weight="700" fill="#ffffff">Carbu.com</text>
  <text x="40" y="136" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#dce6f5">Belgique · France · Luxembourg</text>
  <text x="40" y="168" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#9cc3ec">for Gladys Assistant</text>
</svg>
