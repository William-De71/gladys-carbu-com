name: Bug report
description: Something does not work as described in the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. The integration has no account nor key; its logs name your postal code, your fuels and the stations of your area.
  - type: input
    id: gladys-version
    attributes:
      label: Gladys version
      description: Settings → System.
      placeholder: '5.1.1'
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Integrations → Carbu.com, or Settings → Supervision.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Country, postal code and fuels
      description: 'As set in the configuration, and the station concerned if any.'
      placeholder: 'BE, 4000, Diesel (B7) + Super 95 (E10)'
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Press the **Diagnostic** button of the configuration, then copy the lines starting with “Carbu.com diagnostic” from the Logs tab of the integration. In developer mode, the environment variable `DEBUG=gladys-integration-sdk` adds the SDK debug logs.
      render: text
